<title>경제 채널 모닝스캔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<style>
  :root {
    --bg: #F4F2F1;
    --surface: #FFFFFF;
    --surface-2: #FAF8F7;
    --border: #E4DFDD;
    --border-strong: #D2CBC8;
    --text: #1B1817;
    --text-2: #5C5451;
    --text-3: #8B817D;
    --accent: #A32B2B;
    --accent-ink: #A32B2B;
    --accent-wash: #F6E9E7;
    --shadow: 0 1px 2px rgba(27, 24, 23, .05), 0 6px 18px -10px rgba(27, 24, 23, .18);

    --f-display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
    --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161413;
      --surface: #1E1B1A;
      --surface-2: #262221;
      --border: #332E2C;
      --border-strong: #453E3B;
      --text: #EDE9E7;
      --text-2: #A79E9A;
      --text-3: #7B7270;
      --accent: #E68A8A;
      --accent-ink: #E68A8A;
      --accent-wash: #3A2321;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -10px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --bg: #161413;
    --surface: #1E1B1A;
    --surface-2: #262221;
    --border: #332E2C;
    --border-strong: #453E3B;
    --text: #EDE9E7;
    --text-2: #A79E9A;
    --text-3: #7B7270;
    --accent: #E68A8A;
    --accent-ink: #E68A8A;
    --accent-wash: #3A2321;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -10px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--f-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px 72px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--text);
  }

  .eyebrow {
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: clamp(30px, 5.4vw, 42px);
    line-height: 1.14;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }

  .dateline {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--text-3);
    margin: 12px 0 0;
    font-variant-numeric: tabular-nums;
  }

  .tally { display: flex; gap: 26px; padding-bottom: 4px; }

  .tally-item .n {
    font-family: var(--f-display);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    display: block;
    font-variant-numeric: tabular-nums;
  }

  .tally-item .n.hot { color: var(--accent-ink); }

  .tally-item .k {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-3);
    display: block;
    margin-top: 7px;
  }

  /* ---------- section headers ---------- */

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 44px 0 16px;
  }

  .sec-head h2 {
    font-family: var(--f-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin: 0;
  }

  .sec-head .rule { flex: 1; height: 1px; background: var(--border-strong); }

  .sec-head .note {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--text-3);
  }

  /* ---------- new videos ---------- */

  .feed { display: flex; flex-direction: column; gap: 12px; }

  .feed .empty {
    margin: 0;
    padding: 22px 2px;
    font-size: 13.5px;
    color: var(--text-3);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .card {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 17px 19px;
    box-shadow: var(--shadow);
    color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }

  .card:hover, .card:has(.card-link:focus-visible) {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .card:has(.card-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 제목 링크가 카드 전체를 덮는다. 버튼(.actions)은 그 위에 뜨도록 z-index 를 준다. */
  .card-link { color: inherit; text-decoration: none; outline: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; border-radius: 4px; }

  .body { min-width: 0; }

  /* ---------- 정리하기 버튼 (브리지가 살아 있을 때만 표시) ---------- */

  .actions { display: none; position: relative; z-index: 1; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  body.bridge .actions { display: flex; }

  .act {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .04em;
    padding: 6px 11px;
    border-radius: 3px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-2);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }

  .act:hover { border-color: var(--accent); color: var(--accent-ink); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .act.primary { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 500; }
  .act.primary:hover { background: var(--accent-ink); color: #fff; filter: brightness(1.08); }
  .act:disabled { cursor: default; opacity: .7; }
  .act.sent, .act.sent:hover { border-color: var(--border); background: var(--surface); color: var(--text-3); }

  .meta-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .chan { font-size: 12px; font-weight: 600; color: var(--accent-ink); }

  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }

  .when {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .card h3 {
    font-family: var(--f-body);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.44;
    margin: 0;
    letter-spacing: -.003em;
    word-break: break-word;
  }

  .subnote {
    margin: 10px 0 0;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.5;
    padding-left: 10px;
    border-left: 2px solid var(--accent-wash);
  }

  /* duration column */

  .runtime {
    text-align: right;
    padding-top: 1px;
    white-space: nowrap;
  }

  .runtime .d {
    display: block;
    font-family: var(--f-mono);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }

  .runtime .kind {
    display: block;
    margin-top: 6px;
    font-family: var(--f-mono);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-3);
  }

  .runtime .kind.live { color: var(--accent-ink); }

  /* ---------- quiet channels ---------- */

  .quiet { display: flex; flex-direction: column; border-top: 1px solid var(--border); }

  .qrow {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }

  .qrow:hover .qtitle, .qrow:focus-visible .qtitle { color: var(--accent-ink); }
  .qrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .qchan { font-size: 12.5px; font-weight: 600; color: var(--text-2); }

  .qtitle {
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.45;
    min-width: 0;
    transition: color .15s ease;
  }

  .qago {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--text-3);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- roster ---------- */

  .roster { margin-top: 44px; }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
    gap: 10px;
  }

  .rcell {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
  }

  .rcell .rname { font-size: 12.5px; font-weight: 600; display: block; }

  .rcell .rfilter {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--accent-ink);
    display: block;
    margin-top: 4px;
  }

  footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-family: var(--f-mono);
    font-size: 11px;
    line-height: 1.8;
    color: var(--text-3);
  }

  @media (max-width: 620px) {
    .wrap { padding: 30px 16px 56px; }
    .card { grid-template-columns: 1fr; gap: 14px; }
    .runtime { text-align: left; display: flex; align-items: baseline; gap: 10px; }
    .runtime .kind { margin-top: 0; }
    .tally { gap: 20px; }
    .qrow { grid-template-columns: 1fr auto; row-gap: 4px; }
    .qchan { grid-column: 1 / -1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="wrap">

  <header class="masthead">
    <div>
      <p class="eyebrow">지난 24시간 · 경제 채널 5곳</p>
      <h1>경제 채널 모닝스캔</h1>
      <p class="dateline"><!--DATELINE--></p>
    </div>
    <div class="tally">
      <div class="tally-item">
        <span class="n hot"><!--NEWCOUNT--></span>
        <span class="k">새 영상</span>
      </div>
      <div class="tally-item">
        <span class="n"><!--QUIETCOUNT--></span>
        <span class="k">조용한 채널</span>
      </div>
    </div>
  </header>

  <div class="sec-head">
    <h2>새 영상</h2>
    <span class="rule"></span>
    <span class="note">최신순</span>
  </div>

  <div class="feed">

<!--FEED-->

  </div>

  <div class="sec-head">
    <h2>새 영상 없음</h2>
    <span class="rule"></span>
    <span class="note">직전 업로드</span>
  </div>

  <div class="quiet">

<!--QUIET-->

  </div>

  <section class="roster">
    <div class="sec-head" style="margin-top:0">
      <h2>추적 중인 채널</h2>
      <span class="rule"></span>
    </div>
    <div class="roster-grid">
<!--ROSTER-->
    </div>
  </section>

  <footer>
    매일 아침 9시 KST 갱신 · 직전 24시간 업로드 기준 · 모든 채널 쇼츠 제외<!--FILTERED-->
  </footer>

</div>

<script>
  // cmux 브라우저 패널에서 열렸을 때만 동작한다. 로컬 브리지(scripts/bridge.py)가 응답하면 "정리하기" 버튼을 켜고,
  // 클릭하면 브리지가 이 터미널에 /youtube-study-note 또는 /news-briefing-digest 명령을 타이핑한다.
  // Artifact 페이지에서는 외부 fetch 가 막혀 있어 버튼이 그대로 숨겨진다.
  (function () {
    const BRIDGE_PORT = <!--BRIDGE_PORT-->;
    const base = 'http://127.0.0.1:' + BRIDGE_PORT;
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 1500);

    fetch(base + '/health', { signal: ctrl.signal })
      .then(r => (r.ok ? r.text() : Promise.reject(new Error('health ' + r.status))))
      .then(text => {
        if (!text.startsWith('ok')) return;
        document.body.classList.add('bridge');
        document.querySelectorAll('.act').forEach(btn => {
          btn.addEventListener('click', ev => {
            ev.preventDefault();
            ev.stopPropagation();
            const card = btn.closest('.card');
            const q = new URLSearchParams({ v: card.dataset.v, skill: btn.dataset.skill });
            const label = btn.textContent;
            btn.disabled = true;
            btn.textContent = '보내는 중…';
            fetch(base + '/note?' + q)
              .then(r => r.json().then(j => (r.ok && j.ok ? j : Promise.reject(new Error(j.error || r.status)))))
              .then(() => {
                btn.classList.add('sent');
                btn.textContent = '터미널로 보냄 ✓';
              })
              .catch(err => {
                btn.disabled = false;
                btn.textContent = label + ' (실패, 다시)';
                console.error('bridge /note', err);
              });
          });
        });
      })
      .catch(() => { /* 브리지 없음 — 버튼은 숨긴 채로 둔다 */ });
  })();
</script>
