name: Deploy notes to Pages

# notes/ 만 발행한다. scripts/ · web/ · docs/ 는 사이트에 올라가지 않는다.
on:
  push:
    branches: [main]
    paths: ["notes/**", "scripts/build-notes-index.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ponytail: 취소하지 않고 줄 세운다. cancel-in-progress: true 였을 때
# 6초 간격 푸시의 앞 런이 통째로 죽어 그 런의 (당시 여기 있던) slack 잡이 사라졌다 (2026-08-27).
# 슬랙 전송은 daily-slack.yml 로 옮겼지만, 발행 런이 죽으면 중간 상태가 사라지는 건 같아 그대로 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ponytail: 세 액션 다 Node 24 를 선언하는 메이저다 (2026-09-29 action.yml 확인:
      # checkout v7 · upload-pages-artifact v5(내부 upload-artifact v7) · deploy-pages v5).
      # 런 로그에 "Node.js N is deprecated" 가 다시 뜨면 셋을 한꺼번에 올린다.
      - uses: actions/checkout@v7

      # 표준 라이브러리만 쓴다 — ubuntu 기본 python3 로 충분하다
      - run: python3 scripts/build-notes-index.py --selftest
      - run: python3 scripts/build-notes-index.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: notes

      - id: deploy
        uses: actions/deploy-pages@v5
