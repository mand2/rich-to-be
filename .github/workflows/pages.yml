name: Deploy notes to Pages

# notes/ 만 발행한다. scripts/ · web/ · docs/ 는 사이트에 올라가지 않는다.
on:
  push:
    branches: [main]
    paths: ["notes/**", "scripts/build-notes-index.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 표준 라이브러리만 쓴다 — ubuntu 기본 python3 로 충분하다
      - run: python3 scripts/build-notes-index.py --selftest
      - run: python3 scripts/build-notes-index.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: notes

      - id: deploy
        uses: actions/deploy-pages@v4
