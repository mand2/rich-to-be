<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
:root { color-scheme: light dark; --fg:#1f1c17; --bg:#fdfaf3; --muted:#6b645a; --line:#ddd5c4; --accent:#0b57d0; --cue:#f1ebdc;
  /* 종이 노트: --paper 는 책상, --bg 는 종이 */
  --paper:#eae3d3; --rule:rgba(90,120,160,.13); --margin-rule:rgba(190,95,85,.4); }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e6e6e6; --bg:#191b1f; --muted:#9aa0a6; --line:#343a42; --accent:#8ab4f8; --cue:#20242a;
    --paper:#0e1013; --rule:rgba(150,180,220,.08); --margin-rule:rgba(200,110,100,.3); }
}
* { box-sizing: border-box; }
body { margin:0 auto; padding:2rem 1.25rem 3rem; max-width:1100px; background:var(--paper); color:var(--fg);
  font:16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  word-break:keep-all; overflow-wrap:break-word; }
h1 { font-size:1.65rem; line-height:1.35; margin:0 0 1rem; }
h2 { font-size:1.25rem; margin:3rem 0 .75rem; padding-top:.75rem; border-top:2px solid var(--line); }
h3 { font-size:1.15rem; margin:2.5rem 0 .6rem; padding-top:.75rem; border-top:2px solid var(--line); }
/* 소주제. 굵은 한 줄로 보이되 앵커가 붙게 h4 를 쓴다 (목차는 toc_depth 2-3 이라 안 탄다) */
h4 { font-size:1rem; margin:1.75rem 0 .4rem; }
a { color:var(--accent); }
code { background:var(--cue); padding:.1em .35em; border-radius:4px; font-size:.9em; }
code a { text-decoration:none; }
.toc { background:var(--cue); border:1px solid var(--line); border-radius:8px; padding:1rem 1rem 1rem 2rem; margin:1.5rem 0 2rem; }
.toc ul { margin:.6rem 0 0; padding-left:1rem; } .toc li { margin:.2rem 0; }
.toc > summary { margin-left:-1rem; font-weight:600; cursor:pointer; }
/* 마무리(전체 흐름·구간 간 연결)는 표지에서 접었다 편다. summary 가 h2 자리를 대신한다 */
.fold { margin:1.5rem 0; }
.fold > summary { font-size:1.25rem; font-weight:600; cursor:pointer;
  padding-top:.75rem; border-top:2px solid var(--line); }
.fold > summary::marker { font-size:.8em; color:var(--muted); }
.fold > :not(summary) { margin-left:1rem; }
.toc:not([open]) > summary { margin-bottom:0; }
.toc > ul > li > a { font-weight:600; }
table { border-collapse:collapse; width:100%; margin:1rem 0; font-size:.94rem; }
th, td { border:1px solid var(--line); padding:.6rem .75rem; text-align:left; vertical-align:top; }
th { background:var(--cue); }
td:first-child { width:30%; background:var(--cue); }
td ul { margin:0; padding-left:1.15em; }
td li { margin:.3rem 0; }
td li:first-child { margin-top:0; } td li:last-child { margin-bottom:0; }
blockquote { margin:1rem 0; padding:.5rem 1rem; border-left:3px solid var(--line); color:var(--muted); }
/* 쪽 넘김: JS 0줄. 해시가 곧 쪽이라 뒤로가기·북마크·딥링크가 따라온다.
   표지는 늘 펼쳐 두고, `.flip` 인 Part 쪽만 한 장씩 넘긴다. */
.page { background:var(--bg); border:1px solid var(--line); border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.10), 0 10px 28px rgba(0,0,0,.06);
  position:relative; padding:2.25rem 2rem 1.5rem 3.5rem; margin-bottom:2rem;
  /* 줄노트. 본문 line-height(1.7)에 맞춘 피치지만 표·헤딩까지 정확히 앉지는 않는다 —
     ponytail: 흐린 질감으로 두고, 칸을 맞추려 들면 그때 본문 리듬부터 고정해야 한다 */
  background-image:repeating-linear-gradient(var(--bg) 0 calc(1.7em - 1px), var(--rule) calc(1.7em - 1px) 1.7em);
  background-position:0 2.25rem; }
/* 좌측 여백선 */
.page::before { content:""; position:absolute; top:0; bottom:0; left:2.6rem; border-left:1px solid var(--margin-rule); }
/* 줄선 위에 표가 겹치면 지저분하다. 표·인용은 불투명하게 덮는다 (.toc 는 --cue 로 이미 불투명) */
table, blockquote { background:var(--bg); }
/* 코넬 단서/내용 경계 */
td:first-child { border-right:2px solid var(--line); }
.flip { display:none; }
/* `:has(:target)` 는 `#part-3-…` 처럼 쪽 안쪽을 가리키는 목차 링크를 받는다 */
.flip:target, .flip:has(:target) { display:block; }
/* Part 를 겨냥한 해시가 없으면(첫 방문, 마무리 헤딩 링크) 첫 Part 를 편다 */
body:not(:has(.flip:target, .flip :target)) .flip.first { display:block; }
body:has(#all:target) .flip { display:block; }
.page > h2:first-child { margin-top:0; padding-top:0; border-top:0; }
.pagenav { display:flex; margin-top:2.5rem; padding-top:1rem;
  border-top:1px solid var(--line); font-size:.9rem; }
.pagenav .pageno { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
/* 이전/다음은 흐름에서 빼내 화면 좌우에 띄운다. 한 번에 한 쪽만 보이므로 겹칠 일이 없다 */
.pagenav a { position:fixed; top:50%; transform:translateY(-50%); z-index:1;
  padding:.5rem; color:var(--muted); font-size:3.6rem; line-height:1; text-decoration:none; }
.pagenav a:hover, .pagenav a:focus-visible { color:var(--accent); }
/* 본문(max-width 1100px) 바깥에 붙이되, 좁은 화면에서는 가장자리로 물러난다 */
.pagenav .prev { left:max(.75rem, calc(50% - 36rem)); }
.pagenav .next { right:max(.75rem, calc(50% - 36rem)); }
/* `#all` 은 모든 쪽을 펴므로 떠 있는 꺽쇠가 겹친다 — 그때는 통째로 숨긴다 */
body:has(#all:target) .pagenav { display:none; }
hr { border:0; border-top:1px solid var(--line); margin:2.5rem 0; }
@media (max-width:640px) {
  body { padding:1.25rem .8rem 4rem; font-size:15px; }
  table, tbody, tr, td, th { display:block; width:auto; }
  thead { display:none; }
  tr { border:1px solid var(--line); border-radius:8px; margin:1rem 0; }
  td { border:0; } td:first-child { width:auto; border-right:0; border-bottom:1px solid var(--line); }
  .page { padding:1.5rem 1rem 1rem 2.25rem; background-position:0 1.5rem; }
  .page::before { left:1.5rem; }
}
@media print { body { max-width:none; background:none; } h2 { break-before:page; }
  .page { display:block; box-shadow:none; border:0; background:none; padding-left:0; }
  .page::before { display:none; } .pagenav { display:none; } }
</style>
<!--BODY-->
